server {
    listen 80;

    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-NginX-Proxy true;

      # This is necessary to pass the correct IP to be hashed
        real_ip_header X-Real-IP;

        proxy_connect_timeout 300;

      # To support websocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        chunked_transfer_encoding off;

        proxy_pass http://minio:9000/;
    }

    location /v1/token {
        proxy_pass http://security:8082/v1/token;
    }

    location /v1/user {
        proxy_set_header Authorization $http_authorization;
        proxy_pass http://security:8082/v1/user;
    }

    location /v1/users { 
        proxy_set_header Authorization $http_authorization;
        proxy_pass http://security:8082/v1/users;
    }    

    location /v1/validation { 
        proxy_set_header Authorization $http_authorization;
        proxy_pass http://security:8082/v1/token/validation;
    }

    location /v1/upload {
        proxy_set_header Authorization $http_authorization;
        proxy_pass http://uploader:8081/v1/upload;
    }
}
